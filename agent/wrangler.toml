name = "creatorstacked-agent"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Daily heartbeat — currently a no-op stub, see src/index.ts scheduled().
# The actual weekly content pipeline (keyword research, drafting, publishing)
# runs as a separate scheduled Claude Code cloud agent against the SearchFit
# MCP tools, not inside this Worker — see PLAN.md Phase 3.
[triggers]
crons = ["0 14 * * *"]

# Secrets (never committed — set via `wrangler secret put <NAME>`):
